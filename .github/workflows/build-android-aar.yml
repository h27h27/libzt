name: Build Android AAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 30.0.3
    
    - name: Setup Android NDK
      run: |
        sudo $ANDROID_HOME/tools/bin/sdkmanager --install "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Build Android AAR
      run: |
        chmod +x build.sh
        ./build.sh android-aar
    
    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: libzt-android-aar
        path: dist/android-aar-release/*.aar
