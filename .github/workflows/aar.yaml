name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # We need the full history and submodules for ZeroTier core
        fetch-depth: 0
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install and Configure Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653"
        NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
        
        # Write local.properties directly into the library module
        mkdir -p pkg/android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > pkg/android/local.properties
        echo "ndk.dir=$NDK_PATH" >> pkg/android/local.properties
        
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

    - name: Build libzt (Direct Gradle)
      run: |
        chmod +x build.sh
        # Force submodules one last time
        git submodule update --init --recursive
        
        # Go directly to the android directory and run gradle
        cd pkg/android
        chmod +x gradlew
        # We run with --stacktrace to see the REAL error
        ./gradlew assembleRelease --stacktrace || echo "Gradle build failed, checking for partial outputs..."

    - name: Locate AAR and Debug
      run: |
        echo "Searching for any .aar files created..."
        mkdir -p final_output
        
        # Look specifically in the pkg/android directory tree
        find pkg/android -name "*.aar" -exec cp {} final_output/ \;
        
        echo "Files found:"
        ls -R final_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-android-v8a
        path: final_output/
        if-no-files-found: error
