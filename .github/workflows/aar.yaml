name: Build Android AAR

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # This handles submodules automatically during checkout

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # libzt requires the NDK. This ensures the latest NDK is present.
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653" 
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Build
      # We use the environment variable to point the script to the NDK
      run: ./build.sh android-aar "release"

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: libzt-android-aar
        path: dist/ # Ensure this matches the actual output folder of the script
