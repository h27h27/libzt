name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # This handles the SDK paths and tool setup automatically
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        # Use the sdkmanager now that it's in the PATH
        sdkmanager "ndk;25.2.9519653"
        
        # Define the NDK path for libzt
        export NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653
        
        # Ensure Gradle in the subfolder can find the SDK/NDK
        mkdir -p pkg/android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > pkg/android/local.properties
        echo "ndk.dir=$NDK_PATH" >> pkg/android/local.properties
        
        # Pass variables to subsequent steps
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

    - name: Build
      run: |
        chmod +x build.sh
        # Targeting only arm64-v8a as discussed
        ./build.sh android-aar "release" -DANDROID_ABI=arm64-v8a
    - name: List files for debugging
      run: find . -name "*.aar"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-aar
        # This search pattern looks for ANY .aar file in the entire project
        path: "**/*.aar"
        if-no-files-found: error # This will make the job fail if it can't find the file
