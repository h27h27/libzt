name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # We need the full history and submodules for ZeroTier core
        fetch-depth: 0
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install and Configure Android NDK
      run: |
        # Use the EXACT version requested by the project: 25.1.8937393
        sdkmanager "ndk;25.1.8937393"
        
        NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
        
        # Ensure the directory exists before writing properties
        mkdir -p pkg/android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > pkg/android/local.properties
        echo "ndk.dir=$NDK_PATH" >> pkg/android/local.properties
        
        # Export to environment for the build script
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

    - name: Build libzt (Direct Gradle)
      run: |
        # Ensure submodules are ready
        git submodule update --init --recursive
        
        cd pkg/android
        chmod +x gradlew
        # Run the build again; now that NDK versions match, it should proceed to compile
        ./gradlew assembleRelease --stacktrace || echo "Gradle build failed, but checking for outputs..."

    - name: Locate AAR and Debug
      run: |
        mkdir -p final_output
        # Find any AARs in the pkg/android directory
        find pkg/android -name "*.aar" -exec cp {} final_output/ \;
        echo "Files collected for upload:"
        ls -R final_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-android-v8a
        path: final_output/
        if-no-files-found: error
