name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      run: |
        # Install a specific, stable NDK version
        sdkmanager "ndk;25.2.9519653"
        export NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653
        
        # Create local.properties so Gradle knows where the SDK/NDK are
        echo "sdk.dir=$ANDROID_SDK_ROOT" > pkg/android/local.properties
        echo "ndk.dir=$NDK_PATH" >> pkg/android/local.properties
        
        # Set environment variables for the shell
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

    - name: Build
      # Added a 'chmod' just in case the script lost execution permissions
      run: |
        chmod +x build.sh
        ./build.sh android-aar "release"
    - name: List files for debugging
      run: find . -name "*.aar"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-aar
        # This search pattern looks for ANY .aar file in the entire project
        path: "**/*.aar"
        if-no-files-found: error # This will make the job fail if it can't find the file
