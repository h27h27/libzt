name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # We need the full history and submodules for ZeroTier core
        fetch-depth: 0
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install and Configure Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653"
        NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
        
        # Write local.properties directly into the library module
        mkdir -p pkg/android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > pkg/android/local.properties
        echo "ndk.dir=$NDK_PATH" >> pkg/android/local.properties
        
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

    - name: Build libzt
      run: |
        chmod +x build.sh
        # Force submodule update again just in case checkout missed a nested layer
        git submodule update --init --recursive
        
        # Execute build. We use '|| true' because build.sh fails on the 'cp' 
        # command even if the .aar was built successfully.
        ./build.sh android-aar "release" -DANDROID_ABI=arm64-v8a || true

    - name: Locate AAR and Debug
      run: |
        echo "Checking for the AAR file in the Gradle output folder..."
        # This is the standard location where Gradle puts the built library
        SEARCH_DIR="pkg/android/libzt/build/outputs/aar"
        
        mkdir -p final_output
        if [ -d "$SEARCH_DIR" ]; then
            cp $SEARCH_DIR/*.aar final_output/ || echo "No AAR in Gradle folder"
        fi
        
        # Search the whole project as a backup
        find . -name "*.aar" -exec cp {} final_output/ \;
        
        echo "Final files ready for upload:"
        ls -R final_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-android-v8a
        path: final_output/
        if-no-files-found: error
