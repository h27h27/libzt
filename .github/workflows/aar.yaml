name: Build Android AAR (Optimized)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      run: |
        # Use the pre-installed NDK on the runner
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV
        echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV

    - name: Build (arm64-v8a only)
      # We pass the ABI filter to the build script or underlying Gradle
      run: ./build.sh android-aar "release" -DANDROID_ABI=arm64-v8a
    - name: List files for debugging
      run: find . -name "*.aar"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-aar
        # This search pattern looks for ANY .aar file in the entire project
        path: "**/*.aar"
        if-no-files-found: error # This will make the job fail if it can't find the file
